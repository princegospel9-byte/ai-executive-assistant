services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Africa/Accra
      - TZ=Africa/Accra
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      # n8n's Variables feature is paid-license-gated on Community edition -
      # confirmed the hard way (every workflow initially tried to use it and
      # silently failed). Every workflow reads $env.X instead, so these must
      # be real process environment variables, and N8N_BLOCK_ENV_ACCESS_IN_NODE
      # must be false or expressions/Code nodes can't read them. Set actual
      # values via your host's env var / secrets UI (not committed here):
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY,
      # VOYAGE_API_KEY, N8N_WEBHOOK_SECRET, SCHOOLHUB_WEBHOOK_SECRET,
      # SCHOOLHUB_AI_REPLY_SECRET.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - SCHOOLHUB_WEBHOOK_SECRET=${SCHOOLHUB_WEBHOOK_SECRET}
      - SCHOOLHUB_AI_REPLY_SECRET=${SCHOOLHUB_AI_REPLY_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: